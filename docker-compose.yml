version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: insight-engine
    container_name: timeline-explorer
    environment:
      - PAPERS_DIR=/app/data/papers/Papers
      - DB_PATH=/app/data/research.db
      - TRANSFORMERS_CACHE=/app/data/models
      # API Keys
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    volumes:
      # Mount data for persistence
      - ./data:/app/data
      # Mount source code for live reloading during development
      - ./src:/app/src
      # Mount scripts for diagnostics
      - ./scripts:/app/scripts
    # Keep container running or interactive
    stdin_open: true
    tty: true
    command: streamlit run src/ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - neo4j
      - ollama

  neo4j:
    image: neo4j:5.12-community
    container_name: timeline-graph-db
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    volumes:
      # Use Named Volumes to avoid Windows "PID file" locking issues
      - neo4j_storage:/data
      - neo4j_logs:/logs

  ollama:
    image: ollama/ollama:latest
    container_name: timeline-llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # GPU Reservation (Commented out to fix WSL 'no adapters found' error)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [ gpu ]

volumes:
  neo4j_storage:
  neo4j_logs:
  ollama_models:
