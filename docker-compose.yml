# Local development stack. Production runs on Heroku (api + Postgres) and Vercel (web).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scholarlens
      POSTGRES_PASSWORD: scholarlens
      POSTGRES_DB: scholarlens
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarlens"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
