# ScholarLens API on the Oracle "cronos" VM (Ampere A1, 4 OCPU / 24 GB, uk-london-1, next to Neon).
# Caddy terminates HTTPS for api.rstackhub.in (automatic Let's Encrypt) and proxies to the API.
# Secrets live in /opt/scholarlens/api.env on the VM (root-only), never in the repo.
name: scholarlens

services:
  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: scholarlens-api:latest
    restart: unless-stopped
    env_file: /opt/scholarlens/api.env
    environment:
      PORT: "8000"
      # 4 real cores here (the image defaults to 1 thread for tiny PaaS quotas).
      EMBEDDING_THREADS: "2"
      OMP_NUM_THREADS: "2"
    mem_limit: 6g
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
