[project]
name = "scholarlens"
version = "0.1.0"
description = "ScholarLens API: research trend intelligence with single-purpose agents"
authors = [
    { name = "Rahul Surya", email = "rahulsurya021@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.1",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.20",
    "numpy>=2.4.6",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Query()/Header() defaults are the documented pattern

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[project.scripts]
scholarlens-dev = "scholarlens.dev:main"
scholarlens-embed = "scholarlens.jobs.embed:main"
